# Deterministic evaluation and packaging checks. No model calls, credentials,
# uploads, or LangWatch dependency.
name: offline checks

on:
  pull_request:
    paths:
      - "evals/**"
      - "agents/**"
      - "references/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/evals-tier1.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "agents/**"
      - "references/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/evals-tier1.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:fixtures
      - run: pnpm test:v2
      - run: pnpm exec vitest run --config v2/scenarios/vitest.config.ts v2/scenarios/offline-harness.scenario.test.ts
      - run: pnpm scenarios:v2:list
      - run: pnpm legacy:tier1

  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test selective plugin exports
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check packaged trust policies
        run: python3 scripts/sync-trust-policy.py --check
